# Default ST-GoG Training Configuration
dataset: "NATOPS"
use_synthetic: false
cache_dir: "data/cache"
batch_size: 16
num_workers: 0
pin_memory: false

# Model Architecture
tcn_hidden: 128
gcn_hidden: 128
gog_hidden: 128
num_segments: null   # Adaptively inferred based on sequence length
dropout: 0.42
use_se: true
gcn_radii: [1, 3, 5]
pooling: "mean"      # 'mean' or 'attention'
strided_downsample: null

# Training Parameters
epochs: 100
lr: 0.001
weight_decay: 0.0001
label_smoothing: null  # Auto-tuned: 0.10 if classes <= 5 else 0.15
mixup_alpha: 0.2
stochastic_p: 0.2
tta_passes: 7
use_amp: true
seed: 42
print_every: 10

# Output Paths
output_dir: "outputs"
checkpoint_dir: "checkpoints"
